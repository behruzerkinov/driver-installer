name: Build and Release DriverNest

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, Test & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $cmake = Get-Content -Path "DriverNest/CMakeLists.txt" -Raw
          if ($cmake -match 'project\(DriverNest\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
              $ver = $matches[1]
          } else {
              $ver = "1.2.0"
          }
          Write-Host "Detected DriverNest Version: $ver"
          "VERSION=$ver" >> $env:GITHUB_ENV
          "TAG_NAME=v$ver" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -B build -S DriverNest -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build DriverNest Solution
        run: |
          cmake --build build --config Release --parallel

      - name: Execute Test Suite
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Distributable
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $distDir = "dist/DriverNest-$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # Copy binaries and documents
          Copy-Item -Path "build/bin/Release/DriverNest.exe" -Destination "$distDir\" -Force
          if (Test-Path "DriverNest/LICENSE") { Copy-Item -Path "DriverNest/LICENSE" -Destination "$distDir\" -Force }
          if (Test-Path "DriverNest/README.md") { Copy-Item -Path "DriverNest/README.md" -Destination "$distDir\" -Force }
          if (Test-Path "CHANGELOG.md") { Copy-Item -Path "CHANGELOG.md" -Destination "$distDir\" -Force }

          # Create zip archive
          $zipPath = "dist/DriverNest-$ver-windows-x64.zip"
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force
          
          # Compute SHA-256 hash
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  DriverNest-$ver-windows-x64.zip" | Out-File -FilePath "dist/DriverNest-$ver-windows-x64.zip.sha256" -Encoding ascii
          
          Write-Host "Packaged distributable: $zipPath (SHA256: $hash)"

      - name: Extract Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
              $changelog = Get-Content -Path "CHANGELOG.md" -Raw
              # Match section between ## [vX.Y.Z] and next ## [
              $pattern = "(?ms)## \[$ver\].*?(?=\n## \[|\Z)"
              if ($changelog -match $pattern) {
                  $notes = $matches[0].Trim()
              }
          }
          if (-not $notes) {
              $notes = "Release DriverNest v$ver with enhanced telemetry, automated CI releases, and high-performance driver deployment."
          }
          Set-Content -Path "release_notes.md" -Value $notes
          Write-Host "Generated Release Notes:"
          Write-Host $notes

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: DriverNest ${{ env.TAG_NAME }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
